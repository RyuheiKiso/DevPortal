# Backstage ソフトウェアカタログに登録するコンポーネント定義
apiVersion: backstage.io/v1alpha1
# 種別はコンポーネント
kind: Component
# メタ情報
metadata:
  # コンポーネント識別子（カタログ内で一意）
  name: ${{ values.component_id }}
  # 画面に表示する名称
  title: ${{ values.app_title }}
  # 説明文
  description: ${{ values.description }}
  # アノテーション
  annotations:
    # TechDocs をこのリポジトリ内の docs から生成する
    backstage.io/techdocs-ref: dir:.
  # 検索/分類用のタグ
  tags:
    # React 製
    - react
    # TypeScript 製
    - typescript
    # フロントエンド
    - frontend
    # Web
    - web
    # Vite 製
    - vite
# 仕様
spec:
  # 種別（Web サイト/フロントエンド）
  type: website
  # ライフサイクル（新規作成のため experimental）
  lifecycle: experimental
  # 所有者（Group または User）
  owner: ${{ values.owner }}
{%- if values.system %}
  # 所属する論理システム
  system: ${{ values.system }}
{%- endif %}
