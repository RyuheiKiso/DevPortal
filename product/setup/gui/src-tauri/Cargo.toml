# Tauri バックエンド（Rust 側）のクレートメタデータ
[package]
# クレート名（tauri.conf.json の productName と区別する内部名）
name = "gui"
# バージョンはワークスペース定義を継承
version.workspace = true
# Rust edition もワークスペース定義を継承
edition.workspace = true

# ライブラリ部のクレート種別を指定（モバイルビルド時の `tauri::mobile_entry_point` のため）
[lib]
# ライブラリ名（main.rs から `gui_lib::run()` として参照）
name = "gui_lib"
# 各プラットフォーム向けに必要となるクレートタイプを列挙
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gui"
path = "src/main.rs"
test = false

# Tauri の build スクリプトで使う依存
[build-dependencies]
# Tauri のビルド時コード生成（capabilities/icons の事前検証など）
tauri-build = { version = "2.0.0", features = [] }

# 通常のランタイム依存
[dependencies]
# Tauri 本体（v2 系）
tauri = { version = "2.0.0", features = [] }
# シリアライズ用（コマンド戻り値で使用される可能性に備える）
serde = { version = "1.0", features = ["derive"] }
# JSON 取り扱い用
serde_json = "1.0"
# 同一ワークスペースの shared クレートを参照
shared = { path = "../../shared" }
# フォルダ選択ダイアログを提供する Tauri プラグイン
tauri-plugin-dialog = "2"
# OS のデフォルトブラウザで URL を開く Tauri プラグイン
tauri-plugin-opener = "2"
