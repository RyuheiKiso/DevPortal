<!doctype html>
<!-- ルート要素の言語属性を日本語に設定 -->
<html lang="ja">
  <head>
    <!-- 文字エンコーディングを UTF-8 に設定 -->
    <meta charset="UTF-8" />
    <!-- レスポンシブ対応のためのビューポート設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ウィンドウタイトルとは別にブラウザ表示時のタイトル -->
    <title>DevPortal</title>
  </head>
  <body>
    <!-- React アプリのマウント先となるルート要素 -->
    <div id="root"></div>
    <!-- アプリのエントリポイントを ES モジュールとして読み込み -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
