# クレートのメタデータを定義するセクション
[package]
# クレート名（cli/gui からは `shared` という名前で参照される）
name = "shared"
# バージョンはワークスペース側の定義を継承
version.workspace = true
# Rust edition もワークスペース側の定義を継承
edition.workspace = true

# ライブラリクレートとしてビルドする宣言
[lib]

# 全プラットフォーム共通の依存クレート
[dependencies]
# エラー型の定義を簡潔にするため（derive macro）
thiserror = "1"
# JSON シリアライズ（SetupEvent の --json 出力・GUI Channel 転送に使用）
serde = { version = "1", features = ["derive"] }
# JSON 文字列への変換（serde 補助）
serde_json = "1"
# TOML 設定ファイル（setup.toml）の読み書き
toml = "0.8"
# YAML ファイル（verdaccio config.yaml、backstage app-config.yaml）の読み書き
serde_yaml = "0.9"
# %ProgramData% など OS 標準ディレクトリの解決
directories = "5"
# ロギング façade（CLI/GUI 側でそれぞれ初期化する）
log = "0.4"
# テンプレート文字列の置換（verdaccio-config.yaml.tera）
# tera は重いので軽量な独自置換で代替するため省略

# NSSM ランタイム動的取得用クレート
# 同期 HTTP クライアント（ureq 2.x、OS 証明書ストア使用でプロキシ・社内 CA に対応）
ureq = { version = "2", features = ["native-certs"] }
# ZIP ファイル展開（NSSM 配布 zip から nssm.exe を取り出す）
zip = "0.6"
# SHA-256 ハッシュ計算（ダウンロードしたバイナリの改ざん検証）
sha2 = "0.10"
# ハッシュ計算用の Digest トレイトを提供する（sha2 の依存）
digest = "0.10"

# Windows 専用の依存クレート
[target.'cfg(windows)'.dependencies]
# Windows API バインディング（管理者権限確認・ShellExecuteW による runas 昇格）
windows = { version = "0.58", features = [
    # プロセストークン取得（is_elevated 実装用）
    "Win32_Security",
    # OpenProcess / GetCurrentProcess
    "Win32_System_Threading",
    # ShellExecuteW（runas 昇格用）
    "Win32_UI_Shell",
    # BOOL / HANDLE / HWND など基本型
    "Win32_Foundation",
] }
