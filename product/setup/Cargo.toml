# Cargo workspace の宣言セクション
[workspace]
# Cargo の依存解決アルゴリズムをバージョン2に固定（edition 2021 推奨）
resolver = "2"
# このワークスペースに含めるメンバークレートの一覧
members = [
    # コマンドラインアプリ（Rust バイナリ）
    "cli",
    # GUI/CLI 共通ロジックを提供するライブラリ
    "shared",
    # GUI アプリ（Tauri + React）のバックエンドクレート
    "gui/src-tauri",
]

# ワークスペース全体で共有するパッケージメタデータ
[workspace.package]
# 共通バージョン（各クレートから `version.workspace = true` で参照）
version = "0.1.0"
# 共通 edition
edition = "2021"
