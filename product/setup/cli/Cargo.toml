# クレートのメタデータを定義するセクション
[package]
# クレート名（`cargo run -p cli` で起動する際に使用）
name = "cli"
# バージョンはワークスペース側の定義を継承
version.workspace = true
# Rust edition もワークスペース側の定義を継承
edition.workspace = true

# 依存クレートを列挙するセクション
[dependencies]
# 同一ワークスペース内の shared クレートをパス参照で取り込む
shared = { path = "../shared" }
# コマンドライン引数のパースに使用する（derive フィーチャーで構造体からCLIを自動生成）
clap = { version = "4", features = ["derive"] }
# JSON シリアライズ・デシリアライズに使用する（イベントの JSON 出力モード用）
serde_json = "1"
# エラーハンドリングを簡便にするユーティリティクレート
anyhow = "1"
