# Backstage Software Catalog - API エンティティ最小雛形
# 使い方: ファイルをコピーし、`my-*` プレースホルダと definition の中身を実際の値に置換してください
# 公式仕様: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api

# Backstage Catalog のスキーマバージョン (v1alpha1 固定)
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (この雛形は API)
kind: API
# エンティティ自身を識別するメタデータ
metadata:
  # 一意な名前 (kebab-case 必須)
  name: my-api
  # UI 上の説明文 (省略可)
  description: 自分の API についての一行説明
# API 固有の仕様
spec:
  # 種別: openapi / asyncapi / graphql / grpc / trpc のいずれか
  type: openapi
  # ライフサイクル: experimental / production / deprecated
  lifecycle: production
  # 所有者 (Group または User エンティティの name)
  owner: my-team
  # 所属する System (省略可)
  system: my-system
  # API 定義本体 (OpenAPI / GraphQL SDL などをインラインで記述、または `$text: ./spec.yaml` で外部参照)
  definition: |
    openapi: "3.0.0"
    info:
      version: 1.0.0
      title: My API
    paths: {}
