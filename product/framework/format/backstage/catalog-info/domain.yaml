# Backstage Software Catalog - Domain エンティティ最小雛形
# 使い方: ファイルをコピーし、`my-*` プレースホルダを実際の値に置換してください
# 公式仕様: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-domain

# Backstage Catalog のスキーマバージョン (v1alpha1 固定)
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (この雛形は Domain: 複数 System をくくる業務領域)
kind: Domain
# エンティティ自身を識別するメタデータ
metadata:
  # 一意な名前 (kebab-case 必須)
  name: my-domain
  # UI 上の説明文 (省略可)
  description: 自分の Domain についての一行説明
# Domain 固有の仕様
spec:
  # 所有者 (Group または User エンティティの name)
  owner: my-team
  # 親 Domain (サブドメインの場合のみ指定、省略可)
  # subdomainOf: my-parent-domain
