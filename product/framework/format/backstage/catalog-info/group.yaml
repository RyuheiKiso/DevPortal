# Backstage Software Catalog - Group エンティティ最小雛形
# 使い方: ファイルをコピーし、`my-*` プレースホルダを実際の値に置換してください
# 公式仕様: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group

# Backstage Catalog のスキーマバージョン (v1alpha1 固定)
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (この雛形は Group: チーム / 部署 / 組織単位)
kind: Group
# エンティティ自身を識別するメタデータ
metadata:
  # 一意な名前 (kebab-case 必須、Component の owner から参照される値)
  name: my-team
  # UI 上の説明文 (省略可)
  description: 自分のチームについての一行説明
# Group 固有の仕様
spec:
  # 種別: team / business-unit / product-area / root / sub-department 等
  type: team
  # プロフィール情報 (省略可)
  profile:
    # UI に表示する正式名称
    displayName: My Team
    # 連絡先メールアドレス
    email: my-team@example.com
  # 親 Group (省略可)
  # parent: my-parent-group
  # 子 Group の一覧 (必須だが空配列で可)
  children: []
  # メンバー (User エンティティ名の配列、省略可)
  # members:
  #   - my-user
