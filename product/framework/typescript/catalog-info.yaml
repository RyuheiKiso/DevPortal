# Backstage Software Catalog - framework/typescript ルート Location
# このファイル 1 つを Backstage に登録すると、targets に列挙した
# 33 ファイル (Group+Domain / 8 System / 24 Component) が一括で取り込まれる

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (Location: 他カタログファイルへのポインタ)
kind: Location
# エンティティ自身を識別するメタデータ
metadata:
  # Location 自身の一意な名前
  name: k1s0-ts-framework
  # UI 表示用の説明文
  description: framework/typescript 配下の 33 個のカタログファイルを一括登録するエントリポイント
# Location 固有の仕様
spec:
  # 参照先タイプ (相対パスでも url 指定で動作)
  type: url
  # 取り込み対象ファイル (相対パス、Location ファイル基準)
  targets:
    # 所有者 (Group + Domain)
    - ./owners.yaml
    # auth ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/auth/catalog-info.yaml
    - ./library/auth/core/catalog-info.yaml
    - ./library/auth/react/catalog-info.yaml
    - ./library/auth/react-native/catalog-info.yaml
    # config ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/config/catalog-info.yaml
    - ./library/config/core/catalog-info.yaml
    - ./library/config/react/catalog-info.yaml
    - ./library/config/react-native/catalog-info.yaml
    # error ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/error/catalog-info.yaml
    - ./library/error/core/catalog-info.yaml
    - ./library/error/react/catalog-info.yaml
    - ./library/error/react-native/catalog-info.yaml
    # http ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/http/catalog-info.yaml
    - ./library/http/core/catalog-info.yaml
    - ./library/http/react/catalog-info.yaml
    - ./library/http/react-native/catalog-info.yaml
    # logger ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/logger/catalog-info.yaml
    - ./library/logger/core/catalog-info.yaml
    - ./library/logger/react/catalog-info.yaml
    - ./library/logger/react-native/catalog-info.yaml
    # notification ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/notification/catalog-info.yaml
    - ./library/notification/core/catalog-info.yaml
    - ./library/notification/react/catalog-info.yaml
    - ./library/notification/react-native/catalog-info.yaml
    # storage ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/storage/catalog-info.yaml
    - ./library/storage/core/catalog-info.yaml
    - ./library/storage/react/catalog-info.yaml
    - ./library/storage/react-native/catalog-info.yaml
    # camera ドメイン: System + Component 3 種 (library/ サブフォルダ配下)
    - ./library/camera/catalog-info.yaml
    - ./library/camera/core/catalog-info.yaml
    - ./library/camera/react/catalog-info.yaml
    - ./library/camera/react-native/catalog-info.yaml
