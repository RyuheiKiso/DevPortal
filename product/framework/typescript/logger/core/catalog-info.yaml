# Backstage Software Catalog - Component: @k1s0-ts-logger/core

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (Component)
kind: Component
# エンティティ自身を識別するメタデータ
metadata:
  # Component の一意な名前
  name: k1s0-ts-logger-core
  # UI 表示用の説明文 (package.json の description より)
  description: "DevPortal 共通の構造化ロガー (コア機能: ログレベル・フィルタ・バッチ・複数トランスポート・zod validation)"
  # 検索・フィルタ用タグ
  tags:
    - typescript
    - library
    - logger
# Component 固有の仕様
spec:
  # 種別 (再利用ライブラリ)
  type: library
  # ライフサイクル (本番利用可)
  lifecycle: production
  # 所有者 (owners.yaml で定義した Group)
  owner: k1s0-framework-team
  # 所属する System (logger ドメイン)
  system: k1s0-ts-logger
