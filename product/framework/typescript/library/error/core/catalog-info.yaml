# Backstage Software Catalog - Component: @k1s0-ts-error/core

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (Component)
kind: Component
# エンティティ自身を識別するメタデータ
metadata:
  # Component の一意な名前
  name: k1s0-ts-error-core
  # UI 表示用の説明文 (package.json の description より)
  description: "DevPortal 共通の AppError 正規化・分類・シリアライズ・ログ/通知アダプタユーティリティ"
  # 検索・フィルタ用タグ
  tags:
    - typescript
    - library
    - error
# Component 固有の仕様
spec:
  # 種別 (再利用ライブラリ)
  type: library
  # ライフサイクル (本番利用可)
  lifecycle: production
  # 所有者 (owners.yaml で定義した Group)
  owner: k1s0-framework-team
  # 所属する System (error ドメイン)
  system: k1s0-ts-error
