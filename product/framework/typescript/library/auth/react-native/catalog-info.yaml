# Backstage Software Catalog - Component: @k1s0-ts-auth/react-native

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (Component)
kind: Component
# エンティティ自身を識別するメタデータ
metadata:
  # Component の一意な名前
  name: k1s0-ts-auth-react-native
  # UI 表示用の説明文
  description: "DevPortal React Native bindings for authentication state, authorization hooks, protected rendering, and native token storage adapters."
  # 検索・フィルタ用タグ
  tags:
    - typescript
    - library
    - react-native
    - auth
# Component 固有の仕様
spec:
  # 種別 (再利用ライブラリ)
  type: library
  # ライフサイクル (本番利用可)
  lifecycle: production
  # 所有者 (owners.yaml で定義した Group)
  owner: k1s0-framework-team
  # 所属する System (auth ドメイン)
  system: k1s0-ts-auth
  # core パッケージに依存する
  dependsOn:
    - component:k1s0-ts-auth-core
