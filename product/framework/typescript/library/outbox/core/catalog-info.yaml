# Backstage Software Catalog - Component: @k1s0-ts-outbox/core

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (Component)
kind: Component
# エンティティ自身を識別するメタデータ
metadata:
  # Component の一意な名前
  name: k1s0-ts-outbox-core
  # UI 表示用の説明文 (package.json の description より)
  description: "DevPortal common outbox pattern core for at-least-once message delivery with retry, scheduler, dead-letter queue, and idempotency-key support."
  # 検索・フィルタ用タグ
  tags:
    - typescript
    - library
    - outbox
# Component 固有の仕様
spec:
  # 種別 (再利用ライブラリ)
  type: library
  # ライフサイクル (本番利用可)
  lifecycle: production
  # 所有者 (owners.yaml で定義した Group)
  owner: k1s0-framework-team
  # 所属する System (outbox ドメイン)
  system: k1s0-ts-outbox
  # 任意依存 (peerDependencies は optional だが、依存グラフでは関連を明示する)
  dependsOn:
    - component:default/k1s0-ts-storage-core
    - component:default/k1s0-ts-http-core
