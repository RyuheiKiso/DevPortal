# Backstage Software Catalog - Component: @k1s0-ts-outbox/react-native

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (Component)
kind: Component
# エンティティ自身を識別するメタデータ
metadata:
  # Component の一意な名前
  name: k1s0-ts-outbox-react-native
  # UI 表示用の説明文
  description: "DevPortal React Native bindings for the outbox pattern library, with AsyncStorage adapter."
  # 検索・フィルタ用タグ
  tags:
    - typescript
    - library
    - outbox
    - react-native
# Component 固有の仕様
spec:
  # 種別 (再利用ライブラリ)
  type: library
  # ライフサイクル (本番利用可)
  lifecycle: production
  # 所有者
  owner: k1s0-framework-team
  # 所属する System
  system: k1s0-ts-outbox
  # @k1s0-ts-outbox/core に依存
  dependsOn:
    - component:default/k1s0-ts-outbox-core
