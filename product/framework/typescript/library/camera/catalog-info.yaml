# Backstage Software Catalog - System: @k1s0-ts-camera/* パッケージ群

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (System)
kind: System
# エンティティ自身を識別するメタデータ
metadata:
  # System の一意な名前
  name: k1s0-ts-camera
  # UI 表示用の説明文
  description: "@k1s0-ts-camera/* (core / react / react-native) headless カメラライブラリ群 (静止画 / 動画 / プレビュー / バーコード)"
# System 固有の仕様
spec:
  # 所有者 (Group)
  owner: k1s0-framework-team
  # 所属する Domain
  domain: k1s0-framework
