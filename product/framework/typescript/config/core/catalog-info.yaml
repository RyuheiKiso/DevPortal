# Backstage Software Catalog - Component: @k1s0-ts-config/core

# Backstage Catalog のスキーマバージョン
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (Component)
kind: Component
# エンティティ自身を識別するメタデータ
metadata:
  # Component の一意な名前
  name: k1s0-ts-config-core
  # UI 表示用の説明文 (package.json の description より)
  description: "DevPortal 共通の設定読取・管理ライブラリ (コア機能: 環境・ページ・機能フラグ・データ型・zod validation)"
  # 検索・フィルタ用タグ
  tags:
    - typescript
    - library
    - config
# Component 固有の仕様
spec:
  # 種別 (再利用ライブラリ)
  type: library
  # ライフサイクル (本番利用可)
  lifecycle: production
  # 所有者 (owners.yaml で定義した Group)
  owner: k1s0-framework-team
  # 所属する System (config ドメイン)
  system: k1s0-ts-config
