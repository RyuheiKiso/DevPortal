# ===========================================================================
# Gradle Wrapper 設定
# プロジェクトに同梱する Gradle のバージョンと配布形態を固定する
# ===========================================================================

# Wrapper 内に Gradle 本体を格納するディレクトリ (ユーザー HOME 配下)
distributionBase=GRADLE_USER_HOME
# distributionBase からの相対パス
distributionPath=wrapper/dists
# ダウンロードキャッシュの配置ベース
zipStoreBase=GRADLE_USER_HOME
# zipStoreBase からの相対パス
zipStorePath=wrapper/dists
# 使用する Gradle バージョン (KMP 2.1.0 / AGP 8.7 と互換性あり)
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
# ダウンロードチェックサム検証用 SHA-256 (任意・空でも動作)
networkTimeout=10000
# 同一バージョンの Gradle 配布物再ダウンロードを避けるための検証
validateDistributionUrl=true
