# ============================================================================
# Gradle バージョンカタログ
# ライブラリ・プラグインのバージョンを一元管理する
# 子モジュールからは `libs.xxx` で参照する
# ============================================================================

[versions]
# Android Gradle Plugin (AGP) のバージョン
agp = "8.7.3"
# Kotlin コンパイラ・標準ライブラリのバージョン (KMP/CMP と整合させる)
kotlin = "2.1.0"
# Compose Multiplatform プラグインのバージョン
composeMultiplatform = "1.7.3"
# AndroidX Core KTX (Android プラットフォーム拡張)
androidxCoreKtx = "1.15.0"
# AndroidX Lifecycle (ViewModel / lifecycleScope など)
androidxLifecycle = "2.8.7"
# AndroidX Activity Compose 連携
androidxActivityCompose = "1.9.3"
# Kotlinx Coroutines (Multiplatform 対応版)
kotlinxCoroutines = "1.9.0"
# Kotlinx Serialization (Multiplatform 対応版)
kotlinxSerialization = "1.7.3"
# Android SDK 設定値 (compileSdk / minSdk / targetSdk)
androidCompileSdk = "35"
androidMinSdk = "24"
androidTargetSdk = "35"

[libraries]
# Android Core KTX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
# Android Lifecycle Runtime (Compose lifecycle と統合)
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
# Android Activity の Compose 統合 (ComponentActivity.setContent {} を提供)
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }
# Coroutines コアライブラリ (commonMain で使用)
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# Coroutines Android 拡張 (Main ディスパッチャ実体)
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# Coroutines Swing 拡張 (Desktop の Main ディスパッチャ実体)
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
# Serialization JSON 実装
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
# Android アプリプラグイン
androidApplication = { id = "com.android.application", version.ref = "agp" }
# Android ライブラリプラグイン
androidLibrary = { id = "com.android.library", version.ref = "agp" }
# Kotlin Multiplatform プラグイン
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Compose Multiplatform プラグイン
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# Compose コンパイラプラグイン (Kotlin 2.0 以降必須・Kotlin と同バージョン)
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Kotlin Serialization プラグイン
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
