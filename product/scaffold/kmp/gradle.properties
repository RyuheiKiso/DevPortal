## ===========================================================================
## Gradle 全体設定 (gradle.properties)
## ビルド速度・メモリ・ターゲット有効化フラグなどを宣言する
## ===========================================================================

## --- Gradle / JVM ---------------------------------------------------------
# Gradle Daemon JVM への引数 (ヒープサイズ・文字コード・並列 GC)
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# サブプロジェクトのビルドを並列実行する (マルチモジュール向け)
org.gradle.parallel=true
# 構成キャッシュを有効化してビルド時間を短縮する
org.gradle.caching=true
# Configuration Cache を有効化 (ビルド設定の再計算を抑制)
org.gradle.configuration-cache=true

## --- Kotlin ---------------------------------------------------------------
# Kotlin インクリメンタルコンパイル有効化
kotlin.incremental=true
# KMP の階層的なソースセット (Hierarchical Multiplatform) を強制有効化
kotlin.mpp.enableCInteropCommonization=true
# kotlin/native 開発で発生する警告を抑制
kotlin.mpp.stability.nowarn=true
# Kotlin Multiplatform から Android ターゲットを許可
kotlin.mpp.androidSourceSetLayoutVersion=2

## --- Android (AGP) --------------------------------------------------------
# AndroidX (Jetpack) を使用する (Support Library ではなく)
android.useAndroidX=true
# 非トランジティブな R クラスを生成 (R 衝突を回避し、ビルドを高速化)
android.nonTransitiveRClass=true

## --- Compose Multiplatform -----------------------------------------------
# Web ターゲット (wasmJs) を有効化するフラグ (Compose Multiplatform 1.6+)
org.jetbrains.compose.experimental.wasm.enabled=true
