# Backstage Software Catalog - System: k1s0-scaffold
# 社内アプリ用スターターキット群 (React SPA + React Native Windows)

# Backstage Catalog のスキーマバージョン (v1alpha1 固定)
apiVersion: backstage.io/v1alpha1
# エンティティ種別 (System: 関連 Component をまとめる単位)
kind: System
# エンティティ自身を識別するメタデータ
metadata:
  # System の一意な名前 (各 Component の system から参照される)
  name: k1s0-scaffold
  # UI 表示用の説明文
  description: "DevPortal の社内アプリ用スターターキット群 (React SPA / React Native Windows)"
# System 固有の仕様
spec:
  # 所有者 (framework/typescript で先に登録済みの Group)
  owner: k1s0-framework-team
  # 所属する Domain (framework/typescript で先に登録済み)
  domain: k1s0-framework
