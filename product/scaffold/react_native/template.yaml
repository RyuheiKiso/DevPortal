# Backstage Software Template - React Native Windows (VS2026) スターター
# Backstage UI の /create/templates に表示され、社内利用者が新規 React Native Windows プロジェクトをここから生成できる

# Backstage Scaffolder のスキーマバージョン (v1beta3 が現行安定版)
apiVersion: scaffolder.backstage.io/v1beta3
# エンティティ種別 (Template = Scaffolder の雛形)
kind: Template
# エンティティ自身を識別するメタデータ
metadata:
  # Template の一意な名前 (kebab-case 必須、ディレクトリ名 react_native とは別表記)
  name: k1s0-scaffold-react-native-template
  # UI カードの見出し
  title: "React Native Windows (VS2026)"
  # UI カードの説明文
  description: "React Native 0.84 + Windows ネイティブ (VS2026) のアプリスターターを新規生成"
  # 検索・フィルタ用タグ
  tags:
    - scaffold
    - react-native
    - windows
    - typescript
# Template 固有の仕様
spec:
  # 所有者 (framework/typescript で先に登録済みの Group)
  owner: k1s0-framework-team
  # 生成される Component の種別
  type: website
  # ユーザー入力フォーム定義 (JSON Schema 形式)
  parameters:
    # 入力グループ (UI 上のステップ)
    - title: プロジェクト基本情報
      # 入力必須項目の列挙
      required:
        - name
        - packageName
      # フィールド定義
      properties:
        # プロジェクト名 (必須、kebab-case)
        name:
          title: プロジェクト名
          type: string
          description: 新規プロジェクトのディレクトリ名 (kebab-case 推奨)
          # kebab-case を強制する正規表現
          pattern: '^[a-z][a-z0-9-]*$'
          # 開いたらこのフィールドにフォーカスする
          ui:autofocus: true
        # 説明文 (任意)
        description:
          title: 説明 (任意)
          type: string
          description: 新規プロジェクトの簡単な説明
          # 未入力時のデフォルト
          default: "React Native 0.84 + Windows ネイティブアプリ"
        # Android/iOS のパッケージ名 (reverse-DNS、必須)
        packageName:
          title: パッケージ名 (reverse-DNS)
          type: string
          description: "Android applicationId / iOS Bundle ID として利用 (例: com.example.myapp)"
          # reverse-DNS の最小妥当性チェック (lower snake + dot 区切り 2 セグメント以上)
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
          # 既定値はプロジェクト名から推定 (Nunjucks フィルタで '-' を '_' に変換)
          default: "com.example.example"
  # 生成時に走らせるアクション (上から順に実行)
  steps:
    # skeleton 配下を取得し Nunjucks プレースホルダを展開する
    - id: fetch
      name: スターターファイルを取得
      action: fetch:template
      input:
        # template.yaml の位置からの相対パス (../skeleton/react_native を fetch:template の対象とする)
        url: ../skeleton/react_native
        # 出力先 (Backstage Scaffolder のワークスペース直下)
        targetPath: ./
        # cookiecutter スタイルの構文サポートは不要、デフォルトの ${{ values.x }} を使う
        # Nunjucks 展開時に参照される変数 (skeleton 内で ${{ values.x }} として読まれる)
        values:
          # プロジェクト名 (package.json / app.json / ios xcodeproj 名 等で展開される)
          name: ${{ parameters.name }}
          # 説明文 (README に展開される)
          description: ${{ parameters.description }}
          # Android applicationId / iOS Bundle ID
          packageName: ${{ parameters.packageName }}
          # Android Java パッケージのディレクトリ階層 (com.example.app → com/example/app)
          packageNamePath: ${{ parameters.packageName | replace(".","/") }}
  # 生成後に UI に表示する案内
  output:
    text:
      - title: 完了案内
        content: |
          React Native Windows スターター ${{ parameters.name }} を生成しました。

          ## 次の手順

          1. `npm install` を実行して依存を解決
          2. Visual Studio 2026 を使う場合は `$env:MinimumVisualStudioVersion = "18.0"` を設定
          3. `npx react-native run-windows` で Windows ネイティブアプリを起動

          ## 既知の制約

          - **Windows プロジェクト名は "ReactNative" 固定**: 構造上、windows/ 配下のプロジェクト名 / Identity は ReactNative のままです。Visual Studio は GUID で識別するため動作に支障はありません。

          詳細は同梱の README.md を参照してください。
